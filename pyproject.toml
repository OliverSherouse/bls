[tool.poetry]
name = "bls"
version = "0.4.0.dev"
description = "A library to access Bureau of Labor Statistics data"
authors = ["Oliver Sherouse <oliver@oliversherouse.com>"]
license = "GPL-2.0-or-later"
readme = "README.md"
repository = "https://github.com/OliverSherouse/bls"
keywords = ["BLS", "labor", "statistics", "economics", "data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
include=["*.txt", "*.md"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = ">=2.0"
pandas = ">=0.20"


[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
ipython = "^8.10.0"
flake8-bugbear = "^20.1.4"
ty = "0.0.64"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
