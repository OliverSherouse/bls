[project]
name = "bls"
version = "0.4.0.dev0"
description = "A library to access Bureau of Labor Statistics data"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "GPL-2.0-or-later"
authors = [
    { name = "Oliver Sherouse", email = "oliver@oliversherouse.com" },
]
keywords = ["BLS", "labor", "statistics", "economics", "data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=0.20",
    "requests>=2.0",
]

[project.urls]
Repository = "https://github.com/OliverSherouse/bls"

[dependency-groups]
dev = [
    "flake8-bugbear>=20.1.4,<21.0.0",
    "ipython>=8.10.0,<9.0.0",
    "pytest>=9.0.3,<10.0.0",
    "ty==0.0.64",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
